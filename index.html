<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Remap keys and control lighting on the LEOBOG Hi75C Pro from your browser — no driver install. Works on Mac, Windows and Linux in Chrome or Edge.">
<title>Hi75C Pro — Key Remapper</title>
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=202611070230">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-model">Hi75C Pro</span>
    <span class="brand-sub" data-i="appSub">Key Remapper</span>
  </div>
  <span class="status"><span class="dot" id="dot"></span><span id="status" data-i="notConnected">Not connected</span></span>
  <div class="spacer"></div>
  <button class="ghost" id="btnLang" type="button">عربي</button>
  <button class="primary" id="btnConnect" type="button" data-i="connect">Connect keyboard</button>
  <button class="write" id="btnWrite" type="button" disabled><span data-i="write">Write to keyboard</span><span class="pending" id="pending" hidden></span></button>
</header>

<main>
  <section class="stage" aria-label="Keyboard">
    <div class="seg" id="modeTabs" role="tablist"></div>
    <p class="note" id="modeNote"></p>
    <div class="seg" id="layerTabs" role="tablist"></div>
    <p class="hint" id="layerHint"></p>
    <div class="kbwrap"><div class="kb" id="kb"></div></div>
    <div class="toolbar">
      <div class="group">
        <button id="btnRead" type="button" data-i="readKeymap">Read from keyboard</button>
        <button id="btnMacPreset" type="button" data-i="macPreset" data-i-title="macPresetTip">Mac layout</button>
        <button id="btnTest" type="button" data-i="testMode">Test mode</button>
      </div>
      <div class="group">
        <button class="quiet" id="btnResetKey" type="button" data-i="resetKey">Reset key</button>
        <button class="quiet" id="btnResetLayer" type="button" data-i="resetLayer">Reset layer</button>
        <button class="quiet danger" id="btnResetAll" type="button" data-i="resetAll">Reset all</button>
      </div>
    </div>
    <p class="fine" id="testHint" data-i="testHint" hidden></p>
    <p class="fine" data-i="rescue"></p>
  </section>

  <div class="work">
    <section class="panel" aria-labelledby="hPick">
      <h2 id="hPick" data-i="pickTitle">New function</h2>
      <div class="sel-info" id="selInfo"></div>
      <input type="search" id="search" data-i-ph="searchPh" aria-label="Search">
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="panel" aria-labelledby="hLight">
      <h2 id="hLight" data-i="lighting">Lighting</h2>
      <div class="form">
        <label for="lEffect" data-i="effect"></label><select id="lEffect"></select>
        <label class="lrow" for="lBright" data-i="brightness"></label><input class="lrow" type="range" id="lBright" min="0" max="4" step="1">
        <label class="lrow" for="lSpeed" data-i="speed"></label><input class="lrow" type="range" id="lSpeed" min="0" max="4" step="1">
        <span class="lrow" data-i="color"></span><div class="sw lrow" id="lColors" role="radiogroup"></div>
      </div>
      <div id="sdBox" hidden>
        <p class="fine" data-i="sdHint"></p>
        <div class="row">
          <input type="color" id="sdColor" value="#00ff00" aria-label="Color">
          <button id="sdPaint" type="button" data-i="paint"></button>
          <button id="sdAll" type="button" data-i="fillAll"></button>
          <button id="sdClear" type="button" data-i="clearAll"></button>
        </div>
      </div>
      <div class="row">
        <button id="lRead" type="button" data-i="readLight" disabled></button>
        <button class="write" id="lApply" type="button" data-i="applyLight" disabled></button>
      </div>

      <h2 class="sub" data-i="music">Music sync</h2>
      <div class="form">
        <label for="mSrc" data-i="audio"></label>
        <select id="mSrc"><option value="tab" data-i="srcTab"></option><option value="mic" data-i="srcMic"></option></select>
        <label for="mStyle" data-i="style"></label>
        <select id="mStyle"><option value="bars" data-i="stBars"></option><option value="pulse" data-i="stPulse"></option><option value="wave" data-i="stWave"></option><option value="rain" data-i="stRain"></option><option value="spectrum" data-i="stSpectrum"></option></select>
        <label for="mGain" data-i="sensitivity"></label><input type="range" id="mGain" min="0.5" max="4" step="0.1" value="1.6">
      </div>
      <div class="row"><button class="write" id="mStart" type="button" data-i="start" disabled></button></div>
      <p class="fine" data-i="musicHint"></p>
    </section>

    <div class="side">
      <section class="panel" aria-labelledby="hProf">
        <h2 id="hProf" data-i="profiles">Profiles</h2>
        <select id="profileSel" aria-label="Profile"></select>
        <div class="row">
          <button id="btnNewProfile" type="button" data-i="newProfile"></button>
          <button id="btnExport" type="button">Export</button>
          <button id="btnImport" type="button">Import</button>
        </div>
        <p class="fine" data-i="profilesHint"></p>
      </section>

      <section class="panel">
        <div class="seg small" id="bottomTabs" role="tablist">
          <button class="tab active" type="button" data-t="changes" data-i="changes"></button>
          <button class="tab" type="button" data-t="log">Log</button>
        </div>
        <pre data-p="changes" id="changes"></pre>
        <div data-p="log" hidden>
          <pre id="log"></pre>
          <div class="row"><button id="btnClearLog" type="button" data-i="clear"></button><button id="btnCopyLog" type="button" data-i="copy"></button></div>
        </div>
      </section>
    </div>
  </div>
</main>

<footer class="foot"><p data-i="footer"></p></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box">
  <h2 id="mTitle"></h2>
  <p id="mBody" class="fine"></p>
  <textarea id="mText" aria-label="Text"></textarea>
  <div class="row end">
    <button id="mCopy" type="button" data-i="copy"></button>
    <button id="mCancel" type="button" data-i="cancel"></button>
    <button class="primary" id="mOk" type="button" data-i="ok"></button>
  </div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js?v=202611070230"></script>
</body>
</html>
